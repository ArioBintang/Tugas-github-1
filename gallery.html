<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
            text-align: center;
        }

        h2{
            color: #333;
            margin-bottom: 20Px;
        }

        .slider img:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 15px rgba(0,0,0,2);
        }

        .scroll {
            display: inline-block;
            animation: scroll-left 20s linear infinite;
        }

        @keyframes scroll-left {
            0% {transform: translateX(0);}
            100% {transform: translateX(-100%);}
        }


    </style>
</head>
<body>
    <h2>kumpulan gambar</h2>
    <div class="slider">
        <div class="scroll">
            <img src="asset/1000 (2).png" alt="" width="150" height="150">
            <img src="asset/1000.png" alt="" width="150" height="150">
            <img src="asset/kong.jpg" alt="" width="150" height="150">
            <img src="asset/mothra.png" alt="" width="150" height="150">
            <img src="asset/shimo.png" alt="" width="150" height="150">
            <img src="asset/Tiamat_infobox.png" alt="" width="150" height="150">
            <img src="asset/warbats.png" alt="" width="150" height="150">
        </div>
    </div>
    
</body>
</html>
